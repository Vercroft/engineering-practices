name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  # Every hook in .pre-commit-config.yaml (docs/required-checks.md): suppressions, zizmor and REUSE lint.
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only runs the tools: pinned to a version every pinned package has a wheel for.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Install libmagic, which reuse needs and the runner image does not list
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libmagic1t64
      # gitleaks scans staged changes, and CI has none; the Secret scan check scans the full history.
      - name: Run every hook
        env:
          SKIP: gitleaks
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes --only-binary :all: \
            -r .github/requirements/pre-commit.txt -r .github/requirements/reuse.txt -r .github/requirements/zizmor.txt
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          pre-commit run --all-files --hook-stage manual --show-diff-on-failure

  # The full-history scan from the organisation's shared workflow (STANDARD.md 7C.6), with this
  # repository's .gitleaks.toml, on its default runner.
  secret-scan:
    name: Secret scan
    uses: Vercroft/.github/.github/workflows/reusable-secret-scan.yml@8eca96262002176019f5ff1d42bf651da8634806 # v2.0.0
    permissions:
      contents: read

  # The one CI check the ruleset requires for this file (STANDARD.md 4.6), so a job here can be renamed without a
  # ruleset change. `if: always()` so a failed job cannot skip it; it fails unless every job it needs passed or was
  # skipped. tests/test_gate_summary.py fails when a job in this file is missing from `needs`, when the verdict
  # accepts a failure, or when another job gets an `if:`.
  gate-summary:
    name: Gate summary
    if: always()
    needs: [repository-checks, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every needed job to have passed or been skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {job: need["result"] for job, need in json.loads(os.environ["NEEDS_JSON"]).items()}
          for job, result in sorted(results.items()):
              print(f"{job}: {result}")
          bad = sorted(f"{job}={result}" for job, result in results.items() if result not in ("success", "skipped"))
          if not results or bad:
              sys.exit("not every needed job passed or was skipped: " + (", ".join(bad) or "no jobs"))
          PY
