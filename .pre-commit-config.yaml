# Every small check is a hook (docs/required-checks.md): it runs at commit time, and CI's Repository checks job runs
# every hook once. The hooks with stages: [manual] need a tool most contributors do not have; CI runs them.
minimum_pre_commit_version: "4.4.0"
default_language_version:
  golang: 1.27.3
repos:
  # The git hook of standard §7C.6: gitleaks at commit time, with this repository's config.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks
        args: [--config=.gitleaks.toml]
  - repo: local
    hooks:
      - id: suppressions
        name: Suppressions are listed
        language: unsupported
        entry: sh scripts/check-suppressions.sh
        pass_filenames: false
        always_run: true
      - id: gate-summary
        name: Gate summary judges every CI job
        language: unsupported
        entry: python3 -B -m unittest discover -s tests
        files: ^(\.github/workflows/ci\.yml|tests/)
        pass_filenames: false
      # reuse and zizmor come from .github/requirements/*.txt (hash-pinned), not from their own hook repositories,
      # whose python hooks pre-commit would install without hashes.
      - id: zizmor
        name: zizmor
        language: unsupported
        entry: zizmor --offline .github/workflows
        files: ^\.github/workflows/
        pass_filenames: false
        stages: [manual]
      - id: reuse
        name: REUSE lint
        language: unsupported
        entry: reuse lint
        pass_filenames: false
        always_run: true
        stages: [manual]
